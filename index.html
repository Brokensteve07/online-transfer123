  <meta name="description" content="Know what you're paying before you pay. Real QR payment reader & FX cost estimator for international travelers." />

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <!-- jsQR Client-side QR Decoder -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary-container": "#0b1f33",
            "on-secondary-fixed": "#001a42",
            "on-error": "#ffffff",
            "on-tertiary-container": "#009a43",
            "surface-dim": "#d8dadd",
            "surface-bright": "#f7f9fc",
            "tertiary": "#000601",
            "surface-tint": "#4e6077",
            "tertiary-fixed": "#7ffc97",
            "secondary-container": "#2170e4",
            "primary-fixed": "#d1e4ff",

            "surface-variant": "#e0e3e6",
            "primary": "#00050e",

            "surface-container-high": "#e6e8eb",
            "error": "#ba1a1a",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f7",

            "on-surface-variant": "#44474c"
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          borderRadius: { DEFAULT: '0.25rem', lg: '0.5rem', xl: '0.75rem', '2xl': '1rem', '3xl': '1.25rem', full: '9999px' },
          spacing: { 'container-max': '1200px', xs: '4px', 'margin-mobile': '16px', gutter: '24px', sm: '12px', lg: '40px', base: '8px', xl: '64px', md: '24px' }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; background-color: #f7f9fc; color: #191c1e; }
    .bg-pattern {
      background-color: #f7f9fc;
      background-image: radial-gradient(#d0d5dd 1.2px, transparent 1.2px);
      background-size: 20px 20px;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }
    .wallet-card-bg {
      background: linear-gradient(135deg, #06121E 0%, #0B1F33 50%, #132B45 100%);
      box-shadow: 0 20px 40px -15px rgba(11, 31, 51, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .scanner-frame { box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65); }
    .corner {
      position: absolute; width: 40px; height: 40px; border-color: #2170e4; border-style: solid;
      box-shadow: 0 0 12px rgba(33, 112, 228, 0.7);
    }
    .corner-tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-radius: 12px 0 0 0; }
    .corner-tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-radius: 0 12px 0 0; }
    .corner-bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-radius: 0 0 0 12px; }
    .corner-br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-radius: 0 0 12px 0; }
    .scan-line {
      width: 100%; height: 2.5px; background: #2170e4;
      box-shadow: 0 0 12px #2170e4, 0 0 24px #2170e4;
      animation: scanAnim 2s ease-in-out infinite; opacity: 0.95;
    }
    @keyframes scanAnim { 0% { transform: translateY(0); } 50% { transform: translateY(260px); } 100% { transform: translateY(0); } }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    @keyframes pulseGlow { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.9; } }
    .pulse-glow { animation: pulseGlow 2.5s ease-in-out infinite; }
  </style>
</head>
<body class="bg-pattern text-on-background min-h-screen flex flex-col antialiased selection:bg-secondary-container selection:text-on-secondary-container">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- CONSTANTS & CURRENCIES ---
    const SUPPORTED_CURRENCIES = [
      { code: 'INR', name: 'Indian Rupee', symbol: '₹', flag: '🇮🇳' },
      { code: 'USD', name: 'US Dollar', symbol: '$', flag: '🇺🇸' },
      { code: 'EUR', name: 'Euro', symbol: '€', flag: '🇪🇺' },
      { code: 'GBP', name: 'British Pound', symbol: '£', flag: '🇬🇧' },
      { code: 'JPY', name: 'Japanese Yen', symbol: '¥', flag: '🇯🇵' },
      { code: 'THB', name: 'Thai Baht', symbol: '฿', flag: '🇹🇭' },
      { code: 'SGD', name: 'Singapore Dollar', symbol: 'S$', flag: '🇸🇬' },
      { code: 'AED', name: 'UAE Dirham', symbol: 'AED', flag: '🇦🇪' },
      { code: 'AUD', name: 'Australian Dollar', symbol: 'A$', flag: '🇦🇺' },
      { code: 'CAD', name: 'Canadian Dollar', symbol: 'C$', flag: '🇨🇦' },
    ];

    const DESTINATION_COUNTRIES = [
      { code: 'JP', name: 'Japan', flag: '🇯🇵', currency: 'JPY' },
      { code: 'IN', name: 'India', flag: '🇮🇳', currency: 'INR' },
      { code: 'TH', name: 'Thailand', flag: '🇹🇭', currency: 'THB' },
      { code: 'SG', name: 'Singapore', flag: '🇸🇬', currency: 'SGD' },
      { code: 'AE', name: 'United Arab Emirates', flag: '🇦🇪', currency: 'AED' },
      { code: 'GB', name: 'United Kingdom', flag: '🇬🇧', currency: 'GBP' },
      { code: 'US', name: 'United States', flag: '🇺🇸', currency: 'USD' },
    ];

    const FALLBACK_USD_RATES = {
      USD: 1.0, INR: 83.50, JPY: 151.20, EUR: 0.92, GBP: 0.79,
      THB: 36.20, SGD: 1.35, AED: 3.67, AUD: 1.52, CAD: 1.36
    };

    const SAMPLE_QRS = [
      { id: 'tokyo-ramen', label: 'Tokyo Ramen (Japan JPY)', desc: '¥10,000 Payment QR', flag: '🇯🇵', payload: 'https://payqr.jp/pay?m=Tokyo%20Ramen&amt=10000&cur=JPY' },
      { id: 'hyderabad-cafe', label: 'Hyderabad Cafe (India UPI)', desc: '₹1,000 Indian UPI QR', flag: '🇮🇳', payload: 'upi://pay?pa=hyderabadcafe@upi&pn=Hyderabad%20Cafe&am=1000&cu=INR&tn=Dinner%20Bill' },
      { id: 'bangkok-market', label: 'Bangkok Market (Thailand THB)', desc: '฿850 PromptPay QR', flag: '🇹🇭', payload: 'https://promptpay.io/pay?m=Bangkok%20Night%20Market&amt=850&cur=THB' },
      { id: 'singapore-hawker', label: 'Marina Hawker (Singapore SGD)', desc: 'S$45.00 SGQR', flag: '🇸🇬', payload: 'https://sgqr.nets.com.sg/pay?m=Marina%20Bay%20Hawker&amt=45.00&cur=SGD' }
    ];

    // --- CURRENCY & STORAGE HELPERS ---
    let liveRatesCache = { ...FALLBACK_USD_RATES };

    const fetchFxRates = async () => {
      try {
        const res = await fetch('https://open.er-api.com/v6/latest/USD');
        if (res.ok) {
          const data = await res.json();
          if (data && data.rates) liveRatesCache = { ...FALLBACK_USD_RATES, ...data.rates };
        }
      } catch (e) {}
    };

    const getFxRate = (from, to) => {
      if (from.toUpperCase() === to.toUpperCase()) return 1.0;
      const f = liveRatesCache[from.toUpperCase()] || FALLBACK_USD_RATES[from.toUpperCase()] || 1;
      const t = liveRatesCache[to.toUpperCase()] || FALLBACK_USD_RATES[to.toUpperCase()] || 1;
      return Number((t / f).toFixed(4));
    };

    const formatCurr = (amount, code) => {
      const found = SUPPORTED_CURRENCIES.find(c => c.code === code.toUpperCase());
      const sym = found ? found.symbol : code;
      const fmt = new Intl.NumberFormat('en-US', {
        minimumFractionDigits: code === 'JPY' ? 0 : 2,
        maximumFractionDigits: code === 'JPY' ? 0 : 2,
      }).format(amount);
      return `${sym}${fmt}`;
    };

    const getProfile = () => {
      try {
        const d = localStorage.getItem('globepay_user_profile');
        if (d) return JSON.parse(d);
      } catch (e) {}
      return null;
    };

    const saveProfile = (p) => localStorage.setItem('globepay_user_profile', JSON.stringify(p));

    const getWallet = () => {
      try {
        const d = localStorage.getItem('globepay_wallet_balance');
        if (d) return JSON.parse(d);
      } catch (e) {}
      return {
        balanceHomeCurrency: 50000,
        dailyLimitHomeCurrency: 50000,
        spentTodayHomeCurrency: 6096,
        savedFxHomeCurrency: 840,
        multiCurrencyHoldings: [
          { currency: 'JPY', amount: 50000, flag: '🇯🇵' },
          { currency: 'THB', amount: 5000, flag: '🇹🇭' },
          { currency: 'USD', amount: 500, flag: '🇺🇸' },
          { currency: 'EUR', amount: 250, flag: '🇪🇺' }
        ]
      };
    };

    const saveWallet = (w) => localStorage.setItem('globepay_wallet_balance', JSON.stringify(w));

    const getScans = () => {
      try {
        const d = localStorage.getItem('globepay_scan_history');
        if (d) return JSON.parse(d);
      } catch (e) {}
      const initialScans = [
        { id: 's1', timestamp: new Date(Date.now() - 3600000).toISOString(), merchantName: 'Tokyo Ramen Store', merchantId: 'jp.ramen.shibuya@payqr', country: 'Japan', countryFlag: '🇯🇵', network: 'PayPay / Japan QR', originalCurrency: 'JPY', originalAmount: 1200, homeCurrency: 'INR', convertedAmount: 684, exchangeRate: 0.57, estimatedFxFee: 12, estimatedServiceFee: 15, totalEstimatedCost: 711, status: 'VERIFIED', rawPayload: 'https://payqr.jp/pay?m=TokyoRamen&amt=1200&cur=JPY' },
        { id: 's2', timestamp: new Date(Date.now() - 14400000).toISOString(), merchantName: '7-Eleven Shibuya', merchantId: '711.shibuya.jp', country: 'Japan', countryFlag: '🇯🇵', network: 'Japan PayQR', originalCurrency: 'JPY', originalAmount: 450, homeCurrency: 'INR', convertedAmount: 256.5, exchangeRate: 0.57, estimatedFxFee: 5, estimatedServiceFee: 10, totalEstimatedCost: 271.5, status: 'VERIFIED', rawPayload: 'https://payqr.jp/pay?m=7ElevenShibuya&amt=450&cur=JPY' }
      ];
      localStorage.setItem('globepay_scan_history', JSON.stringify(initialScans));
      return initialScans;
    };

    const saveScan = (item) => {
      const current = getScans();
      localStorage.setItem('globepay_scan_history', JSON.stringify([item, ...current]));
    };

    const parseQR = (text) => {
      const t = text.trim();
      if (t.toLowerCase().startsWith('upi://pay')) {
        try {
          const url = new URL(t);
          const p = url.searchParams;
          return {
            type: 'UPI_QR', network: 'UPI (Unified Payments Interface)',
            merchantName: p.get('pn') ? decodeURIComponent(p.get('pn')) : null,
            merchantId: p.get('pa') ? decodeURIComponent(p.get('pa')) : null,
            country: 'India', countryFlag: '🇮🇳', currency: (p.get('cu') || 'INR').toUpperCase(),
            amount: p.get('am') ? parseFloat(p.get('am')) : null, rawText: t
          };
        } catch (e) {}
      }

      if (t.startsWith('http://') || t.startsWith('https://')) {
        try {
          const u = new URL(t);
          const p = u.searchParams;
          const host = u.hostname.toLowerCase();

          const isJP = host.includes('payqr.jp') || host.includes('paypay') || host.includes('.jp');
          const isTH = host.includes('promptpay') || host.includes('.th');
          const isSG = host.includes('sgqr') || host.includes('nets') || host.includes('.sg');

          let m = p.get('m') || p.get('merchant') || p.get('pn') || p.get('payee');
          if (m) m = decodeURIComponent(m);
          let amt = p.get('amt') || p.get('amount') || p.get('am');
          let cur = p.get('cur') || p.get('currency') || p.get('cu');

          if (isJP) return { type: 'FOREIGN_PAYMENT_QR', network: 'PayPay / Japan QR Network', merchantName: m || 'Tokyo Ramen', merchantId: host, country: 'Japan', countryFlag: '🇯🇵', currency: (cur || 'JPY').toUpperCase(), amount: amt ? parseFloat(amt) : null, rawText: t };
          if (isTH) return { type: 'FOREIGN_PAYMENT_QR', network: 'Thai PromptPay QR', merchantName: m || 'Thailand Merchant', merchantId: host, country: 'Thailand', countryFlag: '🇹🇭', currency: (cur || 'THB').toUpperCase(), amount: amt ? parseFloat(amt) : null, rawText: t };
          if (isSG) return { type: 'FOREIGN_PAYMENT_QR', network: 'SGQR Singapore', merchantName: m || 'Singapore Merchant', merchantId: host, country: 'Singapore', countryFlag: '🇸🇬', currency: (cur || 'SGD').toUpperCase(), amount: amt ? parseFloat(amt) : null, rawText: t };

          return { type: 'FOREIGN_PAYMENT_QR', network: 'International Merchant QR', merchantName: m || host, merchantId: host, country: 'International', countryFlag: '🌐', currency: (cur || 'USD').toUpperCase(), amount: amt ? parseFloat(amt) : null, rawText: t };
        } catch (e) {}
      }

      if (t.toLowerCase().includes('pay') || t.toLowerCase().includes('bill') || t.toLowerCase().includes('invoice')) {
        return { type: 'UNSUPPORTED_PAYMENT_QR', network: 'Unrecognized Protocol', merchantName: null, merchantId: null, country: null, countryFlag: null, currency: null, amount: null, rawText: t };
      }

      return { type: 'NON_PAYMENT_QR', network: 'Standard QR Code', merchantName: null, merchantId: null, country: null, countryFlag: null, currency: null, amount: null, rawText: t };
    };

    // --- MAIN REACT APPLICATION COMPONENT ---
    function GlobePayApp() {
      const [profile, setProfile] = useState(getProfile());
      const [wallet, setWallet] = useState(getWallet());
      const [activeTab, setActiveTab] = useState('home');
      const [scans, setScans] = useState(getScans());

      // Login Form State
      const [loginName, setLoginName] = useState('Nikhil');
      const [loginEmail, setLoginEmail] = useState('nikhil@globepay.com');
      const [loginCurrency, setLoginCurrency] = useState('INR');

      // Modals & Drawers
      const [showAddCashModal, setShowAddCashModal] = useState(false);
      const [addCashAmount, setAddCashAmount] = useState('10000');
      const [isSetupOpen, setIsSetupOpen] = useState(false);
      const [showFxCalculator, setShowFxCalculator] = useState(false);
      const [calcAmount, setCalcAmount] = useState('1000');
      const [calcFromCur, setCalcFromCur] = useState('JPY');

      // Scanning Flow States
      const [decodedPayload, setDecodedPayload] = useState(null);
      const [confirmedAmount, setConfirmedAmount] = useState(null);
      const [showExecutionModal, setShowExecutionModal] = useState(false);

      // Camera State targeting REAR BACK CAMERA
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const [facingMode, setFacingMode] = useState('environment'); // REAR CAMERA ON MOBILE
      const [cameraState, setCameraState] = useState('INITIALIZING');
      const [camError, setCamError] = useState(null);
      const [showPresets, setShowPresets] = useState(false);

      useEffect(() => {
        fetchFxRates();
      }, [activeTab, decodedPayload, showExecutionModal, profile]);

      // Camera Loop Scanner
      useEffect(() => {
        let stream = null;
        let animationFrameId = null;

        if (profile && activeTab === 'scan' && !decodedPayload) {
          const initCam = async () => {
            setCameraState('INITIALIZING');
            setCamError(null);

            const constraints = {
              video: {
                facingMode: { ideal: facingMode },
                width: { ideal: 1280 },
                height: { ideal: 720 }
              }
            };

            try {
              stream = await navigator.mediaDevices.getUserMedia(constraints);
              if (videoRef.current) {
                videoRef.current.srcObject = stream;
                await videoRef.current.play();
                setCameraState('ACTIVE');

                const canvas = canvasRef.current || document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const scanFrame = () => {
                  if (videoRef.current && videoRef.current.readyState === videoRef.current.HAVE_ENOUGH_DATA) {
                    canvas.height = videoRef.current.videoHeight;
                    canvas.width = videoRef.current.videoWidth;
                    ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                    if (window.jsQR) {
                      const code = window.jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
                      if (code && code.data) {
                        const parsed = parseQR(code.data);
                        if (stream) stream.getTracks().forEach(t => t.stop());
                        setDecodedPayload(parsed);
                        return;
                      }
                    }
                  }
                  animationFrameId = requestAnimationFrame(scanFrame);
                };
                animationFrameId = requestAnimationFrame(scanFrame);
              }
            } catch (err) {
              try {
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                if (videoRef.current) {
                  videoRef.current.srcObject = stream;
                  await videoRef.current.play();
                  setCameraState('ACTIVE');
                }
              } catch (fallbackErr) {
                if (fallbackErr.name === 'NotAllowedError' || fallbackErr.message?.includes('Permission')) {
                  setCameraState('PERMISSION_DENIED');
                  setCamError('Camera permission is required to scan QR codes.');
                } else {
                  setCameraState('UNAVAILABLE');
                  setCamError('Rear camera unavailable. Try uploading an image or selecting a QR preset.');
                }
              }
            }
          };
          initCam();
        }

        return () => {
          if (stream) stream.getTracks().forEach(t => t.stop());
          if (animationFrameId) cancelAnimationFrame(animationFrameId);
        };
      }, [profile, activeTab, decodedPayload, facingMode]);

      const handleToggleCameraFacing = () => {
        setFacingMode(prev => (prev === 'environment' ? 'user' : 'environment'));
      };

      const handleFileUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

            if (window.jsQR) {
              const code = window.jsQR(imageData.data, imageData.width, imageData.height);
              if (code && code.data) {
                setDecodedPayload(parseQR(code.data));
              } else {
                alert("Couldn't read a QR code from this image. Please try another QR image.");
              }
            }
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const newP = {
          name: loginName.trim() || 'Nikhil',
          email: loginEmail.trim() || 'nikhil@globepay.com',
          country: 'India',
          countryFlag: '🇮🇳',
          homeCurrency: loginCurrency,
          isLoggedIn: true
        };
        saveProfile(newP);
        setProfile(newP);
        setActiveTab('home');
      };

      const handleAddCash = (amtToAdd) => {
        const amt = parseFloat(amtToAdd);
        if (!isNaN(amt) && amt > 0) {
          const updatedW = { ...wallet, balanceHomeCurrency: wallet.balanceHomeCurrency + amt };
          saveWallet(updatedW);
          setWallet(updatedW);
          setShowAddCashModal(false);
        }
      };

      const handleSaveCompleteScan = () => {
        if (decodedPayload && confirmedAmount) {
          const rate = getFxRate(decodedPayload.currency || 'USD', profile.homeCurrency);
          const baseConv = confirmedAmount * rate;
          const isSame = (decodedPayload.currency || 'USD').toUpperCase() === profile.homeCurrency.toUpperCase();
          const fxFee = isSame ? 0 : baseConv * 0.0125;
          const serviceFee = isSame ? 0 : 30;
          const totalCost = Number((baseConv + fxFee + serviceFee).toFixed(2));

          const item = {
            id: `scan-${Date.now()}`,
            timestamp: new Date().toISOString(),
            merchantName: decodedPayload.merchantName || 'Tokyo Ramen',
            merchantId: decodedPayload.merchantId,
            country: decodedPayload.country || 'Japan',
            countryFlag: decodedPayload.countryFlag || '🇯🇵',
            network: decodedPayload.network,
            originalCurrency: decodedPayload.currency || 'JPY',
            originalAmount: confirmedAmount,
            homeCurrency: profile.homeCurrency,
            convertedAmount: Number(baseConv.toFixed(2)),
            exchangeRate: rate,
            estimatedFxFee: Number(fxFee.toFixed(2)),
            estimatedServiceFee: serviceFee,
            totalEstimatedCost: totalCost,
            status: 'VERIFIED',
            rawPayload: decodedPayload.rawText
          };
          saveScan(item);
          setScans(getScans());

          const updatedW = {
            ...wallet,
            balanceHomeCurrency: Math.max(0, wallet.balanceHomeCurrency - totalCost),
            spentTodayHomeCurrency: wallet.spentTodayHomeCurrency + totalCost,
            savedFxHomeCurrency: wallet.savedFxHomeCurrency + (fxFee * 1.5)
          };
          saveWallet(updatedW);
          setWallet(updatedW);
        }
        setDecodedPayload(null);
        setConfirmedAmount(null);
        setShowExecutionModal(false);
        setActiveTab('home');
      };

      // ----------------------------------------------------
      // 1. ULTRA-CLEAN APPLE MINIMALIST LOGIN SCREEN (NO QR CARD)
      // ----------------------------------------------------
      if (!profile || !profile.isLoggedIn) {
        return (
          <div className="min-h-screen bg-pattern text-[#191c1e] flex flex-col justify-center items-center px-margin-mobile py-12 relative overflow-hidden">
            <div className="w-full max-w-sm space-y-8 z-10">
              {/* Minimal Brand Mark */}
              <div className="text-center space-y-3">
                <div className="w-16 h-16 rounded-2xl bg-[#00050e] text-white flex items-center justify-center font-black text-3xl mx-auto shadow-2xl shadow-slate-950/20">
                  G
                </div>
                <h1 className="text-3xl font-black tracking-tight text-[#00050e]">GlobePay</h1>
                <p className="text-xs text-on-surface-variant font-medium uppercase tracking-widest">Scan. Understand. Pay.</p>
              </div>

              {/* Ultra-Clean Login Card */}

                  <div className="flex justify-between text-on-surface-variant">
                    <span>Est. FX Fee (1.25%)</span>
                    <span>{formatCurr(confirmedAmount * getFxRate(decodedPayload.currency || 'JPY', profile.homeCurrency) * 0.0125, profile.homeCurrency)}</span>
                  </div>
                  <div className="flex justify-between text-on-surface-variant pb-2 border-b border-surface-variant">
                    <span>Est. Service Fee</span>
                    <span>{formatCurr(30, profile.homeCurrency)}</span>
                  </div>
                </div>

                <div className="space-y-2">
                  <button onClick={() => setShowExecutionModal(true)} className="w-full h-14 bg-secondary-container text-white font-bold rounded-2xl text-sm shadow-md">Open Payment Method</button>
                  <button onClick={handleSaveCompleteScan} className="w-full h-14 bg-transparent border border-outline-variant text-primary font-bold rounded-2xl text-xs">Deduct & Save to History</button>
                </div>
              </div>
            )}

            {/* SCREEN: ACTIVITY LOG */}
            {activeTab === 'activity' && !decodedPayload && (
              <div className="space-y-4">
                <h1 className="text-2xl font-extrabold text-primary">Scan History</h1>
                <div className="bg-white rounded-3xl p-6 shadow-sm border border-outline-variant divide-y divide-surface-variant">
                  {scans.map(s => (
                    <div key={s.id} className="py-3 flex items-center justify-between text-xs">
                      <div className="flex items-center space-x-3">
                        <span className="text-2xl">{s.countryFlag}</span>
                        <div>
                          <h4 className="font-bold text-sm text-primary">{s.merchantName}</h4>
                          <span className="text-[10px] text-on-surface-variant">{s.country} • {s.network}</span>
                        </div>
                      </div>
                      <div className="text-right">
                        <div className="font-bold text-primary">{formatCurr(s.originalAmount, s.originalCurrency)}</div>
                        <div className="font-bold text-secondary">≈ {formatCurr(s.totalEstimatedCost, s.homeCurrency)}</div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* SCREEN: PROFILE */}
            {activeTab === 'profile' && !decodedPayload && (
              <div className="space-y-4">
                <div className="bg-white rounded-3xl p-6 shadow-sm border border-outline-variant space-y-4">
                  <div className="flex items-center space-x-4">
                    <div className="w-14 h-14 rounded-2xl bg-primary text-white flex items-center justify-center font-bold text-xl">{profile.name.charAt(0)}</div>
                    <div>
                      <h2 className="font-extrabold text-lg text-primary">{profile.name}</h2>
                      <p className="text-xs text-on-surface-variant">{profile.email} • {profile.countryFlag} {profile.homeCurrency}</p>
                    </div>
                  </div>
                  <button onClick={() => { localStorage.removeItem('globepay_user_profile'); setProfile(null); }} className="w-full py-3 bg-error-container text-on-error-container font-bold rounded-2xl text-xs border border-error/20">Sign Out</button>
                </div>
              </div>
            )}
          </main>

          {/* AUTHORIZATION MODAL */}
          {showExecutionModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4 text-center">
                <div className="w-12 h-12 bg-secondary-fixed text-on-secondary-fixed rounded-full flex items-center justify-center mx-auto font-bold text-xl">✓</div>
                <h3 className="font-extrabold text-lg text-primary">Payment Authorized</h3>
                <p className="text-xs text-on-surface-variant">Merchant QR payload decoded and verified successfully. Converted cost updated in wallet.</p>
                <button onClick={handleSaveCompleteScan} className="w-full py-3 bg-primary text-white rounded-2xl font-bold text-xs">Complete Transaction</button>
              </div>
            </div>
          )}

          {/* BottomNavBar */}
          <nav className="bg-surface-container-lowest shadow-lg fixed bottom-0 w-full z-50 rounded-t-2xl border-t border-outline-variant pb-safe md:hidden">
            <div className="flex justify-around items-center px-4 py-2">
              <button onClick={() => { setDecodedPayload(null); setActiveTab('home'); }} className={`flex flex-col items-center text-xs font-semibold p-1 ${activeTab === 'home' ? 'text-secondary font-bold' : 'text-on-surface-variant'}`}>
                <span className="material-symbols-outlined text-2xl">home</span>
                <span className="text-[10px]">Home</span>
              </button>

              <button onClick={() => { setDecodedPayload(null); setActiveTab('scan'); }} className="flex flex-col items-center justify-center bg-secondary text-white rounded-full p-2 w-12 h-12 shadow-lg -mt-5">
                <span className="material-symbols-outlined text-2xl">photo_camera</span>
              </button>

              <button onClick={() => { setDecodedPayload(null); setActiveTab('activity'); }} className={`flex flex-col items-center text-xs font-semibold p-1 ${activeTab === 'activity' ? 'text-secondary font-bold' : 'text-on-surface-variant'}`}>
                <span className="material-symbols-outlined text-2xl">receipt_long</span>
                <span className="text-[10px]">Activity</span>
              </button>

              <button onClick={() => { setDecodedPayload(null); setActiveTab('profile'); }} className={`flex flex-col items-center text-xs font-semibold p-1 ${activeTab === 'profile' ? 'text-secondary font-bold' : 'text-on-surface-variant'}`}>
                <span className="material-symbols-outlined text-2xl">person</span>
                <span className="text-[10px]">Profile</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<GlobePayApp />);
  </script>
</body>
</html>
