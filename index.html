<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GlobePay — Scan. Understand. Pay.</title>
  <meta name="description" content="Know what you're paying before you pay. Real QR payment reader & FX cost estimator for international travelers." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary-container": "#0b1f33",
            "surface-bright": "#f7f9fc",
            "tertiary-fixed": "#7ffc97",
            "secondary-container": "#2170e4",
            "surface-variant": "#e0e3e6",
            "primary": "#00050e",
            "on-primary": "#ffffff",
            "surface-container-high": "#e6e8eb",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f4f7",
            "secondary": "#0058be",
            "on-surface": "#191c1e",
            "surface-container": "#eceef1",
            "outline-variant": "#c4c6cd",
            "background": "#f7f9fc",
            "surface": "#f7f9fc",
            "outline": "#74777d",
            "on-surface-variant": "#44474c",
            "on-tertiary-container": "#009a43",
            "on-secondary-container": "#fefcff",
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        }
      }
    }
  </script>

  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; background-color: #f7f9fc; }
    .bg-dot-grid {
      background-color: #f7f9fc;
      background-image: radial-gradient(#d0d5dd 1.2px, transparent 1.2px);
      background-size: 20px 20px;
    }
    .wallet-gradient {
      background: linear-gradient(135deg, #020d17 0%, #0b1f33 45%, #0f2d4a 100%);
    }
    .glass {
      background: rgba(255,255,255,0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.5);
    }
    .scanner-overlay { box-shadow: 0 0 0 9999px rgba(0,0,0,0.65); }
    .corner { position:absolute; width:36px; height:36px; border-color:#2170e4; border-style:solid; box-shadow:0 0 14px rgba(33,112,228,0.8); }
    .corner-tl { top:0; left:0; border-width:4px 0 0 4px; border-radius:10px 0 0 0; }
    .corner-tr { top:0; right:0; border-width:4px 4px 0 0; border-radius:0 10px 0 0; }
    .corner-bl { bottom:0; left:0; border-width:0 0 4px 4px; border-radius:0 0 0 10px; }
    .corner-br { bottom:0; right:0; border-width:0 4px 4px 0; border-radius:0 0 10px 0; }
    .scan-beam {
      width:100%; height:3px;
      background: linear-gradient(90deg, transparent, #2170e4, transparent);
      box-shadow: 0 0 16px #2170e4, 0 0 32px #2170e4;
      animation: beam 2s ease-in-out infinite;
    }
    @keyframes beam { 0%{transform:translateY(0)} 50%{transform:translateY(230px)} 100%{transform:translateY(0)} }
    @keyframes fadeInUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes slideUp { from{opacity:0;transform:translateY(40px)} to{opacity:1;transform:translateY(0)} }
    @keyframes pulseRing { 0%,100%{opacity:0.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.05)} }
    .anim-fade-up { animation: fadeInUp 0.4s ease both; }
    .anim-slide-up { animation: slideUp 0.35s cubic-bezier(.16,1,.3,1) both; }
    .pulse-ring { animation: pulseRing 2s ease-in-out infinite; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    .card { background:#fff; border-radius:1.25rem; border:1px solid #e0e3e6; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
    .btn-primary { background:#0058be; color:#fff; font-weight:700; border-radius:1rem; transition:all .15s; }
    .btn-primary:hover { background:#0049a3; }
    .btn-primary:active { transform:scale(0.97); }
    .btn-ghost { background:transparent; border:1.5px solid #c4c6cd; color:#00050e; font-weight:700; border-radius:1rem; transition:all .15s; }
    .btn-ghost:hover { background:#f2f4f7; }
    input:focus, select:focus { outline:none; border-color:#0058be; box-shadow:0 0 0 3px rgba(0,88,190,0.12); }
    .material-symbols-outlined { font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; }
    .filled { font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24; }
    ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-thumb { background:#c4c6cd; border-radius:4px; }
  </style>
</head>
<body class="bg-dot-grid text-on-background min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ─── CONSTANTS & DESTINATIONS ──────────────────────────────────────────────
    const CURRENCIES = [
      { code:'USD', name:'US Dollar',           symbol:'$',   flag:'🇺🇸' },
      { code:'INR', name:'Indian Rupee',        symbol:'₹',   flag:'🇮🇳' },
      { code:'EUR', name:'Euro',                symbol:'€',   flag:'🇪🇺' },
      { code:'GBP', name:'British Pound',       symbol:'£',   flag:'🇬🇧' },
      { code:'JPY', name:'Japanese Yen',        symbol:'¥',   flag:'🇯🇵' },
      { code:'THB', name:'Thai Baht',           symbol:'฿',   flag:'🇹🇭' },
      { code:'SGD', name:'Singapore Dollar',    symbol:'S$',  flag:'🇸🇬' },
      { code:'AED', name:'UAE Dirham',          symbol:'د.إ', flag:'🇦🇪' },
      { code:'AUD', name:'Australian Dollar',   symbol:'A$',  flag:'🇦🇺' },
      { code:'CAD', name:'Canadian Dollar',     symbol:'C$',  flag:'🇨🇦' },
    ];

    const DESTINATIONS = [
      { code:'IN', country:'India',     currency:'INR', flag:'🇮🇳' },
      { code:'JP', country:'Japan',     currency:'JPY', flag:'🇯🇵' },
      { code:'TH', country:'Thailand',  currency:'THB', flag:'🇹🇭' },
      { code:'SG', country:'Singapore', currency:'SGD', flag:'🇸🇬' },
      { code:'AE', country:'UAE',       currency:'AED', flag:'🇦🇪' },
      { code:'US', country:'USA',       currency:'USD', flag:'🇺🇸' },
      { code:'GB', country:'UK',        currency:'GBP', flag:'🇬🇧' },
    ];

    const FALLBACK = { USD:1,INR:83.5,JPY:151.2,EUR:0.92,GBP:0.79,THB:36.2,SGD:1.35,AED:3.67,AUD:1.52,CAD:1.36 };
    let FX = { ...FALLBACK };

    const SAMPLE_QRS = [
      { label:'Mumbai UPI 🇮🇳',   flag:'🇮🇳', cur:'INR', amt:1000,  payload:'upi://pay?pa=mumbaimango@upi&pn=Mumbai%20Street%20Cafe&am=1000&cu=INR&tn=Dinner' },
      { label:'Tokyo Ramen 🇯🇵', flag:'🇯🇵', cur:'JPY', amt:10000, payload:'https://payqr.jp/pay?m=Tokyo%20Ramen&amt=10000&cur=JPY' },
      { label:'Bangkok Market 🇹🇭',flag:'🇹🇭', cur:'THB', amt:850,  payload:'https://promptpay.io/pay?m=Bangkok%20Night%20Market&amt=850&cur=THB' },
      { label:'Marina Hawker 🇸🇬', flag:'🇸🇬', cur:'SGD', amt:45,   payload:'https://sgqr.nets.com.sg/pay?m=Marina%20Bay%20Hawker&amt=45.00&cur=SGD' },
    ];

    // ─── HELPERS & ACCURATE FX ENGINE ─────────────────────────────────────────
    const fetchFX = async () => {
      try {
        const r = await fetch('https://open.er-api.com/v6/latest/USD');
        if (r.ok) { const d = await r.json(); if (d.rates) FX = { ...FALLBACK, ...d.rates }; }
      } catch(_) {}
    };

    // Exact cross-rate calculation between ANY two currencies
    const rate = (fromCode, toCode) => {
      if (!fromCode || !toCode || fromCode === toCode) return 1.0;
      const fromUSD = FX[fromCode] || FALLBACK[fromCode] || 1;
      const toUSD = FX[toCode] || FALLBACK[toCode] || 1;
      return parseFloat((toUSD / fromUSD).toFixed(6));
    };

    const convertAmount = (amount, fromCode, toCode) => {
      const r = rate(fromCode, toCode);
      return parseFloat((amount * r).toFixed(2));
    };

    const fmt = (amount, code) => {
      if (amount === undefined || amount === null || isNaN(amount)) amount = 0;
      const c = CURRENCIES.find(x => x.code === code);
      const sym = c ? c.symbol : (code || '$');
      const decimals = code === 'JPY' ? 0 : 2;
      return sym + new Intl.NumberFormat('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals }).format(amount);
    };

    const timeAgo = (iso) => {
      const diff = (Date.now() - new Date(iso)) / 1000;
      if (diff < 60) return 'Just now';
      if (diff < 3600) return `${Math.floor(diff/60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff/3600)}h ago`;
      return new Date(iso).toLocaleDateString('en-US', { day:'numeric', month:'short' });
    };

    // ─── STORAGE ─────────────────────────────────────────────────────────────
    const ls = (k, def) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } };
    const ss = (k, v) => localStorage.setItem(k, JSON.stringify(v));

    const defaultWallet = (homeCur = 'USD') => {
      const isUSD = homeCur === 'USD';
      return {
        balance: isUSD ? 600 : 50000,
        dailyLimit: isUSD ? 1000 : 75000,
        spentToday: isUSD ? 75 : 6096.5,
        savedFx: isUSD ? 18.5 : 1240.8,
        holdings: [
          { currency:'INR', amount:10000, flag:'🇮🇳' },
          { currency:'JPY', amount:50000, flag:'🇯🇵' },
          { currency:'THB', amount:5000,  flag:'🇹🇭' },
          { currency:'EUR', amount:250,   flag:'🇪🇺' },
        ]
      };
    };

    const defaultScans = () => {
      const s = [
        { id:'s1', ts: new Date(Date.now()-3600000).toISOString(), merchant:'Mumbai Cafe', country:'India', flag:'🇮🇳', network:'UPI', origCur:'INR', origAmt:1000, homeCur:'USD', converted:11.98, fxFee:0.15, svcFee:0.36, total:12.49, rate:0.012 },
        { id:'s2', ts: new Date(Date.now()-28800000).toISOString(), merchant:'Tokyo Ramen', country:'Japan', flag:'🇯🇵', network:'PayPay QR', origCur:'JPY', origAmt:4500, homeCur:'USD', converted:29.76, fxFee:0.37, svcFee:0.36, total:30.49, rate:0.0066 },
      ];
      ss('gp_scans', s);
      return s;
    };

    // ─── QR PARSER ───────────────────────────────────────────────────────────
    const parseQR = (text) => {
      const t = text.trim();
      if (t.toLowerCase().startsWith('upi://pay')) {
        try {
          const u = new URL(t), p = u.searchParams;
          return { type:'UPI', network:'UPI — Indian Payment Network', merchant: p.get('pn') ? decodeURIComponent(p.get('pn')) : null, merchantId: p.get('pa') ? decodeURIComponent(p.get('pa')) : null, country:'India', flag:'🇮🇳', currency:(p.get('cu')||'INR').toUpperCase(), amount: p.get('am') ? parseFloat(p.get('am')) : null, raw:t };
        } catch(_) {}
      }
      if (t.startsWith('http://') || t.startsWith('https://')) {
        try {
          const u = new URL(t), p = u.searchParams, h = u.hostname.toLowerCase();
          const m = [p.get('m'),p.get('merchant'),p.get('pn'),p.get('payee')].find(Boolean);
          const amt = [p.get('amt'),p.get('amount'),p.get('am')].find(Boolean);
          const cur = [p.get('cur'),p.get('currency'),p.get('cu')].find(Boolean);
          const merchant = m ? decodeURIComponent(m) : null;
          if (h.includes('payqr.jp')||h.includes('paypay')||h.endsWith('.jp'))
            return { type:'INTL', network:'PayPay / Japan QR Network', merchant: merchant||'Japan Merchant', merchantId:h, country:'Japan', flag:'🇯🇵', currency:(cur||'JPY').toUpperCase(), amount:amt?parseFloat(amt):null, raw:t };
          if (h.includes('promptpay')||h.endsWith('.th'))
            return { type:'INTL', network:'Thai PromptPay', merchant:merchant||'Thai Merchant', merchantId:h, country:'Thailand', flag:'🇹🇭', currency:(cur||'THB').toUpperCase(), amount:amt?parseFloat(amt):null, raw:t };
          if (h.includes('sgqr')||h.includes('nets')||h.endsWith('.sg'))
            return { type:'INTL', network:'SGQR Singapore', merchant:merchant||'SG Merchant', merchantId:h, country:'Singapore', flag:'🇸🇬', currency:(cur||'SGD').toUpperCase(), amount:amt?parseFloat(amt):null, raw:t };
          return { type:'INTL', network:'International Payment QR', merchant:merchant||h, merchantId:h, country:'International', flag:'🌐', currency:(cur||'USD').toUpperCase(), amount:amt?parseFloat(amt):null, raw:t };
        } catch(_) {}
      }
      return { type:'UNKNOWN', network:'Unknown QR Code', merchant:null, merchantId:null, country:null, flag:null, currency:null, amount:null, raw:t };
    };

    // ─── MODALS ───────────────────────────────────────────────────────────────
    function Modal({ children, onClose }) {
      return (
        <div className="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4" onClick={e => e.target === e.currentTarget && onClose()}>
          <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"></div>
          <div className="relative w-full sm:max-w-md sm:rounded-3xl rounded-t-3xl bg-white shadow-2xl anim-slide-up overflow-hidden">
            {children}
          </div>
        </div>
      );
    }

    function TopUpModal({ profile, wallet, onClose, onTopUp }) {
      const isUSD = profile.homeCurrency === 'USD';
      const presets = isUSD ? ['100','250','500','1000'] : ['5000','10000','25000','50000'];
      const [amount, setAmount] = useState(presets[1]);
      return (
        <Modal onClose={onClose}>
          <div className="p-6 space-y-5">
            <div className="flex items-center justify-between">
              <h3 className="text-lg font-extrabold text-primary">Top Up Travel Wallet</h3>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-outline hover:bg-surface-container-high transition"><span className="material-symbols-outlined text-lg">close</span></button>
            </div>
            <div className="grid grid-cols-4 gap-2">
              {presets.map(p => (
                <button key={p} onClick={() => setAmount(p)} className={`py-2.5 rounded-xl text-xs font-bold border transition ${amount===p ? 'bg-secondary text-white border-secondary shadow-md' : 'bg-surface-container border-outline-variant text-primary'}`}>
                  {fmt(parseFloat(p), profile.homeCurrency)}
                </button>
              ))}
            </div>
            <div>
              <label className="text-[11px] font-extrabold uppercase tracking-wider text-on-surface-variant block mb-1">Custom Amount ({profile.homeCurrency})</label>
              <input type="number" value={amount} onChange={e=>setAmount(e.target.value)} className="w-full px-4 py-3 rounded-xl border border-outline-variant bg-surface-container-low text-xl font-black text-center text-primary" />
            </div>
            <div className="flex gap-3">
              <button onClick={onClose} className="flex-1 py-3.5 btn-ghost text-sm">Cancel</button>
              <button onClick={() => onTopUp(parseFloat(amount))} className="flex-1 py-3.5 btn-primary text-sm">Add {fmt(parseFloat(amount)||0, profile.homeCurrency)}</button>
            </div>
          </div>
        </Modal>
      );
    }

    // ─── DYNAMIC MULTI-CURRENCY CONVERTER MODAL ───────────────────────────────
    function FxCalcModal({ profile, wallet, onExchangeInWallet, onClose }) {
      const [amount, setAmount] = useState('1000');
      const [from, setFrom] = useState('INR');
      const [to, setTo] = useState(profile.homeCurrency);
      const [isWalletExchange, setIsWalletExchange] = useState(false);

      const parsedAmt = parseFloat(amount) || 0;
      const currentRate = rate(from, to);
      const inverseRate = rate(to, from);
      const convertedResult = convertAmount(parsedAmt, from, to);

      const fromCurrObj = CURRENCIES.find(c => c.code === from);
      const toCurrObj = CURRENCIES.find(c => c.code === to);

      const handleSwap = () => {
        const temp = from;
        setFrom(to);
        setTo(temp);
      };

      const handleConfirmExchange = () => {
        if (parsedAmt <= 0) return;
        onExchangeInWallet(parsedAmt, from, convertedResult, to);
        onClose();
      };

      return (
        <Modal onClose={onClose}>
          <div className="p-6 space-y-4 max-h-[85vh] overflow-y-auto">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-2">
                <span className="material-symbols-outlined text-secondary text-2xl">currency_exchange</span>
                <h3 className="text-lg font-extrabold text-primary">Live Currency Converter</h3>
              </div>
              <button onClick={onClose} className="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center text-outline"><span className="material-symbols-outlined text-lg">close</span></button>
            </div>

            <div className="flex bg-surface-container p-1 rounded-xl text-xs font-bold">
              <button onClick={()=>setIsWalletExchange(false)} className={`flex-1 py-2 rounded-lg transition ${!isWalletExchange?'bg-white shadow text-secondary':'text-on-surface-variant'}`}>
                Calculator Only
              </button>
              <button onClick={()=>setIsWalletExchange(true)} className={`flex-1 py-2 rounded-lg transition ${isWalletExchange?'bg-white shadow text-secondary':'text-on-surface-variant'}`}>
                Swap Wallet Funds
              </button>
            </div>

            <div className="bg-surface-container-low rounded-2xl p-4 border border-outline-variant space-y-2">
              <div className="flex justify-between items-center text-xs text-on-surface-variant font-semibold">
                <span>Convert From</span>
                <span>{fromCurrObj?.flag} {fromCurrObj?.name}</span>
              </div>
              <div className="flex gap-2">
                <input
                  type="number"
                  value={amount}
                  onChange={e=>setAmount(e.target.value)}
                  placeholder="0"
                  className="flex-1 px-3 py-3 rounded-xl border border-outline-variant bg-white text-xl font-black text-primary"
                />
                <select value={from} onChange={e=>setFrom(e.target.value)} className="w-32 px-3 py-3 rounded-xl border border-outline-variant bg-white text-sm font-extrabold text-primary">
                  {CURRENCIES.map(c=><option key={c.code} value={c.code}>{c.flag} {c.code}</option>)}
                </select>
              </div>
            </div>

            <div className="flex items-center justify-center -my-2 relative z-10">
              <button onClick={handleSwap} className="w-10 h-10 rounded-full bg-secondary text-white shadow-lg flex items-center justify-center hover:bg-blue-700 active:scale-90 transition">
                <span className="material-symbols-outlined text-lg">swap_vert</span>
              </button>
            </div>

            <div className="bg-surface-container-low rounded-2xl p-4 border border-outline-variant space-y-2">
              <div className="flex justify-between items-center text-xs text-on-surface-variant font-semibold">
                <span>Receive In</span>
                <span>{toCurrObj?.flag} {toCurrObj?.name}</span>
              </div>
              <div className="flex gap-2">
                <div className="flex-1 px-4 py-3.5 rounded-xl border border-outline-variant bg-white text-xl font-black text-secondary">
                  {fmt(convertedResult, to)}
                </div>
                <select value={to} onChange={e=>setTo(e.target.value)} className="w-32 px-3 py-3 rounded-xl border border-outline-variant bg-white text-sm font-extrabold text-primary">
                  {CURRENCIES.map(c=><option key={c.code} value={c.code}>{c.flag} {c.code}</option>)}
                </select>
              </div>
            </div>

            <div className="bg-surface-container rounded-2xl p-4 space-y-2 text-xs">
              <div className="flex justify-between items-center font-bold text-primary">
                <span>Exchange Rate</span>
                <span>1 {from} = {fmt(currentRate, to)}</span>
              </div>
              <div className="flex justify-between items-center text-on-surface-variant">
                <span>Inverse Rate</span>
                <span>1 {to} = {fmt(inverseRate, from)}</span>
              </div>
              <div className="flex justify-between items-center text-emerald-700 font-semibold border-t border-surface-variant pt-2">
                <span>Mid-Market Guarantee</span>
                <span className="bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded text-[10px] font-bold">0% Hidden FX Spread</span>
              </div>
            </div>

            {isWalletExchange ? (
              <button onClick={handleConfirmExchange} className="w-full py-4 btn-primary text-sm flex items-center justify-center gap-2">
                <span className="material-symbols-outlined text-lg">published_with_changes</span>
                Exchange {fmt(parsedAmt, from)} → {fmt(convertedResult, to)}
              </button>
            ) : (
              <button onClick={onClose} className="w-full py-3.5 btn-ghost text-sm">Done</button>
            )}
          </div>
        </Modal>
      );
    }

    // ─── LOGIN SCREEN ─────────────────────────────────────────────────────────
    function LoginScreen({ onLogin }) {
      const [name, setName] = useState('');
      const [email, setEmail] = useState('');
      const [currency, setCurrency] = useState('USD');
      const submit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onLogin({ name: name.trim(), email: email.trim(), homeCurrency: currency, countryFlag: CURRENCIES.find(c=>c.code===currency)?.flag||'🇺🇸', isLoggedIn:true, activeDestination:'IN' });
      };
      return (
        <div className="min-h-screen bg-dot-grid flex flex-col items-center justify-center px-5 py-12 relative overflow-hidden">
          <div className="absolute -top-32 -right-32 w-72 h-72 rounded-full bg-blue-100/60 blur-3xl pointer-events-none"></div>
          <div className="absolute -bottom-32 -left-32 w-72 h-72 rounded-full bg-slate-200/60 blur-3xl pointer-events-none"></div>
          <div className="w-full max-w-sm space-y-7 z-10 anim-fade-up">
            <div className="text-center space-y-3">
              <div className="w-16 h-16 rounded-[20px] bg-[#00050e] flex items-center justify-center mx-auto shadow-2xl shadow-slate-950/30">
                <span className="material-symbols-outlined text-white text-3xl filled">language</span>
              </div>
              <h1 className="text-3xl font-black tracking-tight text-[#00050e]">GlobePay</h1>

    // ─── CAMERA SCANNER ───────────────────────────────────────────────────────
    function ScannerScreen({ profile, onDecoded }) {
      const videoRef = useRef(null);
      const [facing, setFacing] = useState('environment');
      const [camState, setCamState] = useState('INIT');
      const [camErr, setCamErr] = useState(null);
      const [showPresets, setShowPresets] = useState(false);
      const streamRef = useRef(null);
      const rafRef = useRef(null);

      const stopCam = useCallback(() => {
        if (streamRef.current) { streamRef.current.getTracks().forEach(t=>t.stop()); streamRef.current=null; }
        if (rafRef.current) { cancelAnimationFrame(rafRef.current); rafRef.current=null; }
      }, []);

      const startCam = useCallback(async () => {
        stopCam();
        setCamState('INIT');
        setCamErr(null);
        try {
          const s = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:facing }, width:{ideal:1920}, height:{ideal:1080} } });
          streamRef.current = s;
          if (!videoRef.current) return;
          videoRef.current.srcObject = s;
          await videoRef.current.play();
          setCamState('ACTIVE');
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const scan = () => {
            if (videoRef.current?.readyState === 4) {
              canvas.width = videoRef.current.videoWidth;
              canvas.height = videoRef.current.videoHeight;
              ctx.drawImage(videoRef.current, 0, 0);
              const img = ctx.getImageData(0,0,canvas.width,canvas.height);
              const code = window.jsQR?.(img.data, img.width, img.height, {inversionAttempts:'dontInvert'});
              if (code?.data) { stopCam(); onDecoded(parseQR(code.data)); return; }
            }
            rafRef.current = requestAnimationFrame(scan);
          };
          rafRef.current = requestAnimationFrame(scan);
        } catch(err) {
          setCamState(err.name==='NotAllowedError'?'DENIED':'ERROR');
          setCamErr(err.name==='NotAllowedError' ? 'Camera access denied. Please allow camera in browser settings.' : 'Camera unavailable on this device.');
        }
      }, [facing, stopCam, onDecoded]);

      useEffect(() => { startCam(); return stopCam; }, [facing]);

      const handleFile = (e) => {
        const file = e.target.files?.[0]; if(!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            const c = document.createElement('canvas');
            c.width = img.width; c.height = img.height;
            c.getContext('2d').drawImage(img,0,0);
            const id = c.getContext('2d').getImageData(0,0,c.width,c.height);
            const code = window.jsQR?.(id.data,id.width,id.height);
            if (code?.data) onDecoded(parseQR(code.data));
            else alert('No QR code found in this image. Try a clearer photo.');
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };

      return (
        <div className="flex flex-col h-full max-w-lg mx-auto space-y-4 anim-fade-up">
          <div className="text-center">
            <h1 className="text-xl font-black text-primary">Scan Payment QR</h1>
            <p className="text-xs text-on-surface-variant mt-0.5">Point your camera at any payment QR code</p>
          </div>

          <div className="relative bg-black rounded-3xl overflow-hidden w-full aspect-square shadow-2xl">
            <video ref={videoRef} className={`w-full h-full object-cover transition-opacity duration-300 ${camState==='ACTIVE'?'opacity-100':'opacity-0'}`} playsInline muted />

            {camState==='ACTIVE' && (
              <>
                <div className="absolute inset-0 scanner-overlay pointer-events-none z-10"></div>
                <div className="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
                  <div className="relative w-52 h-52">
                    <div className="corner corner-tl"></div>
                    <div className="corner corner-tr"></div>
                    <div className="corner corner-bl"></div>
                    <div className="corner corner-br"></div>
                    <div className="absolute top-0 left-0 scan-beam"></div>
                  </div>
                </div>
                <div className="absolute top-0 left-0 right-0 z-30 flex items-center justify-between p-4">
                  <span className="bg-black/50 backdrop-blur-sm text-white text-xs font-bold px-3 py-1.5 rounded-full flex items-center gap-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-ring block"></span>
                    {facing==='environment'?'Rear Camera':'Front Camera'} Active
                  </span>
                </div>
              </>
            )}

            {camState==='INIT' && (
              <div className="absolute inset-0 flex flex-col items-center justify-center gap-3 text-white z-20">
                <div className="w-10 h-10 border-3 border-secondary border-t-transparent rounded-full animate-spin" style={{borderWidth:'3px'}}></div>
                <p className="text-xs font-medium opacity-70">Starting rear camera…</p>
              </div>
            )}

            {(camState==='DENIED'||camState==='ERROR') && (
              <div className="absolute inset-0 flex flex-col items-center justify-center gap-4 text-white z-20 p-6 text-center">
                <span className="material-symbols-outlined text-4xl text-red-400">no_photography</span>
                <p className="text-sm font-semibold text-red-200">{camErr}</p>
                <button onClick={startCam} className="px-5 py-2.5 bg-secondary text-white rounded-xl text-xs font-bold">Retry</button>
              </div>
            )}
          </div>

          <div className="flex items-center justify-center gap-2.5 flex-wrap">
            <button onClick={()=>setFacing(f=>f==='environment'?'user':'environment')} className="flex items-center gap-1.5 px-4 py-2.5 bg-primary text-white text-xs font-bold rounded-2xl shadow active:scale-95 transition">
              <span className="material-symbols-outlined text-base">cameraswitch</span>Flip Cam
            </button>
            <label className="flex items-center gap-1.5 px-4 py-2.5 card text-on-surface text-xs font-bold cursor-pointer active:scale-95 transition">
              <span className="material-symbols-outlined text-base">image</span>Upload Image
              <input type="file" accept="image/*" onChange={handleFile} className="hidden" />
            </label>
            <button onClick={()=>setShowPresets(s=>!s)} className={`flex items-center gap-1.5 px-4 py-2.5 text-xs font-bold rounded-2xl border active:scale-95 transition ${showPresets?'bg-secondary text-white border-secondary':'card text-secondary border-secondary/30'}`}>
              <span className="material-symbols-outlined text-base">qr_code</span>Test QRs
            </button>
          </div>

          {showPresets && (
            <div className="card p-4 anim-slide-up">
              <p className="text-xs font-extrabold text-on-surface-variant uppercase tracking-wider mb-3">Sample Payment QRs</p>
              <div className="grid grid-cols-2 gap-2.5">
                {SAMPLE_QRS.map(q=>(
                  <button key={q.label} onClick={()=>{setShowPresets(false);onDecoded(parseQR(q.payload));}} className="p-3 rounded-xl border border-outline-variant hover:bg-surface-container text-left active:scale-95 transition">
                    <div className="text-xl mb-1">{q.flag}</div>
                    <div className="text-xs font-bold text-primary leading-tight">{q.label}</div>
                    <div className="text-[10px] text-on-surface-variant mt-0.5">{fmt(q.amt, q.cur)}</div>
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── QR RESULT SCREEN ─────────────────────────────────────────────────────
    function QRResultScreen({ payload, profile, onConfirm, onBack }) {
      const [amount, setAmount] = useState(payload.amount ? String(payload.amount) : '');
      const isPayment = payload.type !== 'UNKNOWN';
      const parsed = parseFloat(amount) || 0;

      // Merchant currency from payload (e.g. INR ₹)
      const merchantCur = payload.currency || 'INR';
      // User's home currency (e.g. USD $)
      const homeCur = profile.homeCurrency || 'USD';

      const fxRate = rate(merchantCur, homeCur);
      const baseConv = parsed * fxRate;
      const sameCur = merchantCur === homeCur;
      const fxFee = sameCur ? 0 : baseConv * 0.0125;
      const svcFee = sameCur ? 0 : (homeCur === 'USD' ? 0.36 : 30);
      const totalInHomeCur = baseConv + fxFee + svcFee;

      return (
        <div className="max-w-md mx-auto space-y-4 anim-slide-up">
          <div className="flex items-center gap-3">
            <button onClick={onBack} className="w-9 h-9 rounded-full card flex items-center justify-center active:scale-90 transition">

            </button>
            <h1 className="text-xl font-black text-primary">QR Decoded</h1>
          </div>

          {!isPayment ? (
            <div className="card p-6 text-center space-y-4">
              <div className="w-14 h-14 rounded-full bg-amber-50 flex items-center justify-center mx-auto">
                <span className="material-symbols-outlined text-3xl text-amber-500">warning</span>
              </div>
              <h2 className="font-extrabold text-primary">Not a Payment QR</h2>

              <button onClick={onBack} className="w-full py-3.5 btn-primary text-sm">Scan Another</button>
            </div>
          ) : (
            <>
              <div className="card p-5 space-y-3">
                <div className="flex items-start gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-surface-container flex items-center justify-center text-2xl flex-shrink-0">{payload.flag||'🌐'}</div>
                  <div className="flex-1">
                    <div className="flex items-center gap-2 mb-0.5">
                      <span className={`text-[10px] font-bold px-2.5 py-0.5 rounded-full ${payload.type==='UPI'?'bg-orange-50 text-orange-600 border border-orange-200':'bg-blue-50 text-blue-600 border border-blue-200'}`}>
                        {payload.type==='UPI'?'🇮🇳 Indian UPI QR':'International QR'}
                      </span>
                    </div>
                    <h2 className="font-black text-primary text-base">{payload.merchant||'Merchant'}</h2>
                    <p className="text-[11px] text-on-surface-variant">{payload.network} · {payload.country}</p>
                    {payload.merchantId && <p className="text-[11px] font-mono text-outline mt-0.5 truncate">{payload.merchantId}</p>}
                  </div>
                </div>
              </div>

              <div className="card p-5 space-y-3">
                <label className="text-[11px] font-extrabold uppercase tracking-wider text-on-surface-variant block">
                  Merchant Amount ({merchantCur})
                </label>
                <div className="relative">
                  <span className="absolute left-4 top-1/2 -translate-y-1/2 text-lg font-black text-outline">
                    {CURRENCIES.find(c=>c.code===merchantCur)?.symbol || merchantCur}
                  </span>
                  <input
                    type="number"
                    value={amount}
                    onChange={e=>setAmount(e.target.value)}
                    placeholder="0.00"
                    className="w-full pl-10 pr-4 py-4 rounded-2xl bg-surface-container-low border border-outline-variant text-2xl font-black text-primary text-right"
                  />
                </div>
              </div>

              {parsed > 0 && (
                <div className="card p-5 space-y-3 anim-fade-up">
                  <h3 className="text-[11px] font-extrabold uppercase tracking-wider text-on-surface-variant">Live Conversion Preview</h3>
                  
                  {/* Visual Conversion Box */}
                  <div className="bg-surface-container-low rounded-2xl p-4 border border-outline-variant flex items-center justify-between">
                    <div className="text-left">
                      <p className="text-[11px] text-on-surface-variant font-medium">Merchant Receives</p>
                      <p className="text-lg font-black text-primary">{fmt(parsed, merchantCur)}</p>
                    </div>
                    <span className="material-symbols-outlined text-secondary text-2xl">arrow_forward</span>
                    <div className="text-right">
                      <p className="text-[11px] font-bold text-secondary uppercase">You Pay ({homeCur})</p>
                      <p className="text-2xl font-black text-secondary">{fmt(totalInHomeCur, homeCur)}</p>
                    </div>
                  </div>

                  <div className="bg-surface-container-low rounded-xl p-3 space-y-1.5 text-xs">
                    <div className="flex justify-between text-on-surface-variant"><span>Exchange Rate</span><span className="font-bold text-primary">1 {merchantCur} = {fmt(fxRate, homeCur)}</span></div>
                    {!sameCur && <><div className="flex justify-between text-on-surface-variant"><span>Est. FX Fee (1.25%)</span><span>{fmt(fxFee, homeCur)}</span></div>

          </div>

          <div className="card p-5">
            <div className="flex items-center gap-3 mb-4">
              <div className="w-14 h-14 rounded-2xl bg-surface-container text-3xl flex items-center justify-center">{payload.flag}</div>
              <div>
                <h2 className="text-lg font-black text-primary">{payload.merchant||'Merchant'}</h2>
                <p className="text-xs text-on-surface-variant flex items-center gap-1">
                  <span className="material-symbols-outlined text-sm">location_on</span>{payload.country}
                </p>
                <p className="text-xs text-on-surface-variant flex items-center gap-1">
                  <span className="material-symbols-outlined text-sm">qr_code</span>{payload.network}
                </p>
              </div>
            </div>

            <div className="bg-surface-container-low rounded-2xl p-4 space-y-3">
              <div className="flex justify-between text-sm">
                <span className="text-on-surface-variant">Merchant Requests</span>
                <span className="font-extrabold text-primary text-base">{fmt(amount, merchantCur)}</span>
              </div>
              <div className="border-t border-surface-variant pt-3">
                <p className="text-[11px] font-bold text-secondary uppercase tracking-wide mb-1 flex items-center gap-1">
                  <span className="material-symbols-outlined text-sm">autorenew</span> Your Estimated Cost ({homeCur})
                </p>
                <p className="text-3xl font-black text-secondary">{fmt(calc.total, homeCur)}</p>
              </div>
            </div>
          </div>

          <div className="card p-5 space-y-3">
            <h3 className="font-extrabold text-primary text-sm">Fee Breakdown ({homeCur})</h3>
            {[
              ['Original Merchant Amount', fmt(amount, merchantCur)],
              ['Live Exchange Rate', `1 ${merchantCur} = ${fmt(calc.fxRate, homeCur)}`],
              ['Base Converted Cost', fmt(calc.baseConv, homeCur)],
              ['Est. FX Fee (1.25%)', fmt(calc.fxFee, homeCur)],
              ['Est. Service Fee', fmt(calc.svcFee, homeCur)],
            ].map(([label, value]) => (
              <div key={label} className="flex justify-between text-sm">
                <span className="text-on-surface-variant">{label}</span>
                <span className="font-semibold text-on-surface">{value}</span>
              </div>
            ))}
            <div className="flex justify-between font-extrabold text-primary border-t border-surface-variant pt-3 text-base">
              <span>Total Estimated Cost</span>
              <span className="text-secondary">{fmt(calc.total, homeCur)}</span>
            </div>
          </div>

          <p className="text-[11px] text-center text-outline px-4">Payment information only. GlobePay does not process live bank transactions.</p>

          <div className="space-y-2.5 pb-2">
            <button onClick={onDone} className="w-full py-4 btn-primary text-sm flex items-center justify-center gap-2">
              <span className="material-symbols-outlined text-lg">check</span>Deduct & Save to Scan History
            </button>
            <button onClick={onScanAgain} className="w-full py-3.5 btn-ghost text-sm flex items-center justify-center gap-2">
              <span className="material-symbols-outlined text-base">qr_code_scanner</span>Scan Another QR
            </button>
          </div>
        </div>
      );
    }

    // ─── ACTIVITY SCREEN ──────────────────────────────────────────────────────
    function ActivityScreen({ scans, profile }) {
      return (
        <div className="space-y-4 anim-fade-up">
          <h1 className="text-2xl font-black text-primary">Scan History</h1>
          {scans.length === 0 ? (
            <div className="card p-10 text-center space-y-2">
              <span className="material-symbols-outlined text-5xl text-outline">history</span>
              <p className="font-bold text-on-surface-variant">No scans yet</p>
            </div>
          ) : (
            <div className="card overflow-hidden">
              <div className="divide-y divide-surface-variant">
                {scans.map(s => (
                  <div key={s.id} className="flex items-center gap-3 p-4 hover:bg-surface-container-low transition">
                    <div className="w-11 h-11 rounded-2xl bg-surface-container flex items-center justify-center text-2xl flex-shrink-0">{s.flag}</div>
                    <div className="flex-1 min-w-0">
                      <p className="font-bold text-sm text-primary truncate">{s.merchant}</p>
                      <p className="text-[11px] text-on-surface-variant">{s.country} · {s.network}</p>
                      <p className="text-[11px] text-outline">{timeAgo(s.ts)}</p>
                    </div>
                    <div className="text-right flex-shrink-0">
                      <p className="font-bold text-sm text-primary">{fmt(s.origAmt, s.origCur)}</p>
                      <p className="text-[11px] font-bold text-secondary">≈ {fmt(s.total, profile.homeCurrency)}</p>
                      <p className="text-[10px] text-on-surface-variant">Rate: {s.rate}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── PROFILE SCREEN ───────────────────────────────────────────────────────
    function ProfileScreen({ profile, wallet, onSignOut }) {
      return (
        <div className="space-y-4 anim-fade-up">
          <h1 className="text-2xl font-black text-primary">Profile</h1>
          <div className="card p-6 space-y-5">
            <div className="flex items-center gap-4">
              <div className="w-16 h-16 rounded-2xl wallet-gradient text-white font-black text-2xl flex items-center justify-center shadow-lg">{profile.name.charAt(0).toUpperCase()}</div>
              <div>
                <h2 className="text-xl font-black text-primary">{profile.name}</h2>
                <p className="text-sm text-on-surface-variant">{profile.email || 'No email set'}</p>
                <p className="text-sm font-semibold text-secondary">{profile.countryFlag} {profile.homeCurrency} — Home Currency</p>
              </div>
            </div>
            <div className="bg-surface-container-low rounded-2xl p-4 space-y-2 text-sm">
              <div className="flex justify-between"><span className="text-on-surface-variant">Wallet Balance</span><span className="font-extrabold text-primary">{fmt(wallet.balance, profile.homeCurrency)}</span></div>
              <div className="flex justify-between"><span className="text-on-surface-variant">Daily Limit</span><span className="font-bold">{fmt(wallet.dailyLimit, profile.homeCurrency)}</span></div>
              <div className="flex justify-between"><span className="text-on-surface-variant">FX Saved</span><span className="font-bold text-on-tertiary-container">{fmt(wallet.savedFx, profile.homeCurrency)}</span></div>
            </div>
          </div>
          <button onClick={onSignOut} className="w-full py-3.5 text-sm font-bold rounded-2xl bg-error-container text-on-error-container border border-red-200 active:scale-95 transition">
            Sign Out
          </button>
        </div>
      );
    }

    // ─── BOTTOM NAV ───────────────────────────────────────────────────────────
    function BottomNav({ active, onChange }) {
      const tabs = [
        { id:'home', icon:'home', label:'Home' },
        { id:'scan', icon:'photo_camera', label:'Scan', primary:true },
        { id:'activity', icon:'receipt_long', label:'Activity' },
        { id:'profile', icon:'person', label:'Profile' },
      ];
      return (
        <nav className="fixed bottom-0 left-0 right-0 z-50 bg-surface-container-lowest border-t border-outline-variant pb-safe md:hidden">
          <div className="flex items-center justify-around px-4 py-2 max-w-lg mx-auto">
            {tabs.map(t => (
              <button key={t.id} onClick={()=>onChange(t.id)} className={`flex flex-col items-center gap-0.5 transition ${t.primary ? 'relative -mt-6' : ''}`}>
                {t.primary ? (
                  <div className={`w-14 h-14 rounded-full flex items-center justify-center shadow-xl shadow-blue-600/30 transition ${active==='scan'?'bg-primary scale-105':'bg-secondary'}`}>
                    <span className={`material-symbols-outlined text-white text-2xl ${active==='scan'?'filled':''}`}>{t.icon}</span>
                  </div>
                ) : (
                  <>
                    <div className={`w-10 h-6 rounded-full flex items-center justify-center transition ${active===t.id?'bg-secondary-container/15':''}`}>
                      <span className={`material-symbols-outlined text-2xl transition ${active===t.id?'text-secondary filled':'text-on-surface-variant'}`}>{t.icon}</span>
                    </div>
                    <span className={`text-[10px] font-bold transition ${active===t.id?'text-secondary':'text-on-surface-variant'}`}>{t.label}</span>
                  </>
                )}
              </button>
            ))}
          </div>
        </nav>
      );
    }

    // ─── MAIN APP ─────────────────────────────────────────────────────────────
    function App() {
      const [profile, setProfile] = useState(() => ls('gp_profile', null));
      const [wallet, setWallet] = useState(() => ls('gp_wallet', profile ? defaultWallet(profile.homeCurrency) : defaultWallet('USD')));
      const [scans, setScans] = useState(() => ls('gp_scans', null) || defaultScans());
      const [tab, setTab] = useState('home');

      const [flowStage, setFlowStage] = useState('idle');
      const [decodedPayload, setDecodedPayload] = useState(null);
      const [confirmedAmount, setConfirmedAmount] = useState(null);
      const [confirmedCalc, setConfirmedCalc] = useState(null);

      const [showTopUp, setShowTopUp] = useState(false);
      const [showFxCalc, setShowFxCalc] = useState(false);
      const [showSettings, setShowSettings] = useState(false);

      useEffect(() => { fetchFX(); }, []);

      const handleLogin = (p) => { 
        ss('gp_profile', p); 
        const w = defaultWallet(p.homeCurrency);
        ss('gp_wallet', w);
        setWallet(w);
        setProfile(p); 
        setTab('home'); 
      };

      const handleTopUp = (amount) => {
        const w = { ...wallet, balance: wallet.balance + amount };
        ss('gp_wallet', w); setWallet(w); setShowTopUp(false);
      };

      const handleExchangeInWallet = (fromAmt, fromCode, toAmt, toCode) => {
        const updatedHoldings = wallet.holdings.map(h => {
          if (h.currency === fromCode) return { ...h, amount: Math.max(0, h.amount - fromAmt) };
          if (h.currency === toCode) return { ...h, amount: h.amount + toAmt };
          return h;
        });

        if (!updatedHoldings.some(h => h.currency === toCode)) {
          const flag = CURRENCIES.find(c => c.code === toCode)?.flag || '🌍';
          updatedHoldings.push({ currency: toCode, amount: toAmt, flag });
        }

        const w = { ...wallet, holdings: updatedHoldings };
        ss('gp_wallet', w);
        setWallet(w);
      };

      const handleDecoded = (payload) => { setDecodedPayload(payload); setFlowStage('decoded'); setTab('scan'); };

      const handleConfirm = (amt, calc) => { setConfirmedAmount(amt); setConfirmedCalc(calc); setFlowStage('confirmed'); };

      const handleSaveScan = () => {
        if (decodedPayload && confirmedAmount && confirmedCalc) {
          const item = {
            id: `s${Date.now()}`, ts: new Date().toISOString(),
            merchant: decodedPayload.merchant || 'Merchant',
            country: decodedPayload.country || 'International',
            flag: decodedPayload.flag || '🌐',
            network: decodedPayload.network,
            origCur: decodedPayload.currency || 'INR',
            origAmt: confirmedAmount,
            homeCur: profile.homeCurrency,
            converted: confirmedCalc.baseConv,
            fxFee: confirmedCalc.fxFee,
            svcFee: confirmedCalc.svcFee,
            total: confirmedCalc.total,
            rate: confirmedCalc.fxRate,
          };
          const newScans = [item, ...scans];
          ss('gp_scans', newScans); setScans(newScans);
          const w = {
            ...wallet,
            balance: Math.max(0, wallet.balance - confirmedCalc.total),
            spentToday: wallet.spentToday + confirmedCalc.total,
            savedFx: wallet.savedFx + (confirmedCalc.fxFee * 1.5),
          };
          ss('gp_wallet', w); setWallet(w);
        }
        setFlowStage('idle'); setDecodedPayload(null); setConfirmedAmount(null); setConfirmedCalc(null);
        setTab('home');
      };

      const handleScanAgain = () => { setFlowStage('idle'); setDecodedPayload(null); setConfirmedAmount(null); setConfirmedCalc(null); };

      const handleSignOut = () => { localStorage.clear(); setProfile(null); setTab('home'); };

      if (!profile?.isLoggedIn) return <LoginScreen onLogin={handleLogin} />;

      const activeDest = DESTINATIONS.find(d => d.code === profile.activeDestination) || DESTINATIONS[0];

      return (
        <div className="min-h-screen flex flex-col pb-20 md:pb-0">
          <header className="fixed top-0 left-0 right-0 z-50 bg-surface/90 backdrop-blur-md border-b border-outline-variant">
            <div className="flex items-center justify-between h-16 px-4 max-w-2xl mx-auto">
              <button onClick={()=>{setFlowStage('idle');setDecodedPayload(null);setTab('home');}} className="flex items-center gap-2.5">
                <div className="w-9 h-9 rounded-xl bg-primary flex items-center justify-center font-black text-white text-lg shadow">G</div>
                <span className="text-xl font-black text-primary tracking-tight">GlobePay</span>
              </button>
              <button onClick={()=>setShowSettings(true)} className="flex items-center gap-1.5 bg-surface-container border border-outline-variant px-3 py-1.5 rounded-full text-xs font-bold text-on-surface hover:bg-surface-container-high transition">
                <span>{profile.countryFlag}</span>
                <span className="text-primary font-black">{profile.homeCurrency}</span>
                <span className="text-on-surface-variant font-normal hidden sm:block">· {profile.name}</span>
                <span className="material-symbols-outlined text-base text-outline">expand_more</span>
              </button>
            </div>
          </header>

          {showSettings && (
            <Modal onClose={()=>setShowSettings(false)}>
              <div className="p-6 space-y-4">
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-extrabold text-primary">Traveler Settings</h3>
                  <button onClick={()=>setShowSettings(false)} className="w-8 h-8 rounded-full bg-surface-container flex items-center justify-center"><span className="material-symbols-outlined text-lg text-outline">close</span></button>
                </div>
                <div>
                  <label className="text-[11px] font-extrabold uppercase tracking-wider text-on-surface-variant block mb-1.5">Traveler Name</label>
                  <input type="text" defaultValue={profile.name} id="sName" className="w-full px-4 py-3 rounded-xl border border-outline-variant text-sm font-bold text-primary bg-surface-container-low" />
                </div>
                <div>
                  <label className="text-[11px] font-extrabold uppercase tracking-wider text-on-surface-variant block mb-1.5">Home Base Currency</label>
                  <select defaultValue={profile.homeCurrency} id="sCur" className="w-full px-4 py-3 rounded-xl border border-outline-variant text-sm font-extrabold text-primary bg-surface-container-low">
                    {CURRENCIES.map(c=><option key={c.code} value={c.code}>{c.flag} {c.code} ({c.symbol}) — {c.name}</option>)}
                  </select>
                </div>
                <div>
                  <label className="text-[11px] font-extrabold uppercase tracking-wider text-on-surface-variant block mb-1.5">Current Destination Country</label>
                  <select defaultValue={profile.activeDestination || 'IN'} id="sDest" className="w-full px-4 py-3 rounded-xl border border-outline-variant text-sm font-bold text-primary bg-surface-container-low">
                    {DESTINATIONS.map(d=><option key={d.code} value={d.code}>{d.flag} {d.country} ({d.currency})</option>)}
                  </select>
                </div>
                <button onClick={()=>{
                  const n = document.getElementById('sName').value.trim();
                  const c = document.getElementById('sCur').value;
                  const dest = document.getElementById('sDest').value;
                  const cf = CURRENCIES.find(x=>x.code===c)?.flag||'🇺🇸';
                  const p = {...profile, name:n||profile.name, homeCurrency:c, countryFlag:cf, activeDestination:dest};
                  ss('gp_profile',p); setProfile(p); setShowSettings(false);
                }} className="w-full py-3.5 btn-primary text-sm">Save Preferences</button>
              </div>
            </Modal>
          )}

          {showTopUp && <TopUpModal profile={profile} wallet={wallet} onClose={()=>setShowTopUp(false)} onTopUp={handleTopUp} />}
          {showFxCalc && <FxCalcModal profile={profile} wallet={wallet} onExchangeInWallet={handleExchangeInWallet} onClose={()=>setShowFxCalc(false)} />}

          <main className="pt-20 px-4 max-w-2xl mx-auto w-full flex-1 space-y-4 pb-4">
            {tab === 'home' && flowStage === 'idle' && (
              <>
                {/* Header Greeting */}
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-2xl font-black text-primary">Hello, {profile.name} 👋</h2>
                    <p className="text-xs text-on-surface-variant">Home Currency: <span className="font-bold text-primary">{profile.homeCurrency} ({CURRENCIES.find(c=>c.code===profile.homeCurrency)?.symbol})</span></p>
                  </div>
                  <button onClick={()=>setShowSettings(true)} className="inline-flex items-center gap-1.5 bg-surface-container hover:bg-surface-container-high px-3 py-1.5 rounded-full border border-outline-variant text-xs font-bold text-on-surface transition">
                    <span>{activeDest.flag}</span>
                    <span>{activeDest.country}</span>
                  </button>
                </div>

                <WalletCard profile={profile} wallet={wallet} onScan={()=>setTab('scan')} onTopUp={()=>setShowTopUp(true)} onOpenFx={()=>setShowFxCalc(true)} />
                <StatsRow profile={profile} wallet={wallet} onCalc={()=>setShowFxCalc(true)} />
                <ScanList scans={scans} profile={profile} onViewAll={()=>setTab('activity')} />
              </>
            )}

            {tab === 'scan' && flowStage === 'idle' && (
              <ScannerScreen profile={profile} onDecoded={handleDecoded} />
            )}

            {flowStage === 'decoded' && decodedPayload && (
              <QRResultScreen payload={decodedPayload} profile={profile} onConfirm={handleConfirm} onBack={handleScanAgain} />
            )}

            {flowStage === 'confirmed' && decodedPayload && confirmedAmount && confirmedCalc && (
              <PaymentDetailsScreen payload={decodedPayload} amount={confirmedAmount} calc={confirmedCalc} profile={profile} onDone={handleSaveScan} onScanAgain={handleScanAgain} />
            )}

            {tab === 'activity' && flowStage === 'idle' && (
              <ActivityScreen scans={scans} profile={profile} />
            )}

            {tab === 'profile' && flowStage === 'idle' && (
              <ProfileScreen profile={profile} wallet={wallet} onSignOut={handleSignOut} />
            )}
          </main>

          {flowStage === 'idle' && <BottomNav active={tab} onChange={t=>{setTab(t);}} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
