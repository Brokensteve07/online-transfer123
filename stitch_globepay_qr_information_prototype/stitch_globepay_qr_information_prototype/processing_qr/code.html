<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GlobePay - QR Processing</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-container": "#0b1f33",
                        "on-secondary-fixed": "#001a42",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#009a43",
                        "surface-dim": "#d8dadd",
                        "on-tertiary-fixed": "#002109",
                        "surface-bright": "#f7f9fc",

                        "surface-tint": "#4e6077",
                        "tertiary-fixed": "#7ffc97",
                        "on-primary-fixed-variant": "#36485e",
                        "secondary-container": "#2170e4",
                        "primary-fixed": "#d1e4ff",
                        "on-primary-container": "#7587a0",
                        "on-secondary-fixed-variant": "#004395",
                        "surface-variant": "#e0e3e6",
                        "primary": "#00050e",
                        "tertiary-fixed-dim": "#62df7d",
                        "on-primary": "#ffffff",
                        "on-background": "#191c1e",
                        "surface-container-high": "#e6e8eb",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#eff1f4",
                        "surface-container-low": "#f2f4f7",
                        "secondary": "#0058be",
                        "on-surface": "#191c1e",
                        "on-secondary-container": "#fefcff",
                        "primary-fixed-dim": "#b5c8e3",
                        "surface-container": "#eceef1",
                        "inverse-primary": "#b5c8e3",
                        "surface-container-highest": "#e0e3e6",

                        "outline-variant": "#c4c6cd",
                        "background": "#f7f9fc",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#adc6ff",
                        "surface": "#f7f9fc",

                        "outline": "#74777d",

                        "on-tertiary-fixed-variant": "#005320",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "inverse-surface": "#2d3133",
                        "secondary-fixed": "#d8e2ff",
                        "tertiary-container": "#00240a"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-max": "1200px",
                        "xs": "4px",
                        "margin-mobile": "16px",
                        "gutter": "24px",
                        "sm": "12px",
                        "lg": "40px",
                        "base": "8px",
                        "xl": "64px",
                        "md": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "disclaimer-sm": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "disclaimer-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .pulse-ring {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        @keyframes pulse-ring {
            0% {
                transform: scale(0.8);
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7);
            }
            70% {
                transform: scale(1);
                box-shadow: 0 0 0 20px rgba(59, 130, 246, 0);
            }
            100% {
                transform: scale(0.8);
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
            }
        }

        .scanning-line {
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col relative overflow-hidden">
<!-- Simulated Dimmed Camera View Background -->
<div class="absolute inset-0 z-0">
<div class="bg-cover bg-center w-full h-full opacity-30 filter blur-sm" data-alt="A blurred, out-of-focus background simulating a smartphone camera viewfinder pointing at a modern cafe counter. The lighting is soft and natural, with bokeh effects suggesting depth. The scene is slightly darkened, creating a subtle contrast for a foreground UI. The overall mood is modern, global, and related to retail or dining, using a light mode aesthetic with cool, neutral tones." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCtB2M8o8sT7EyPooQBpxMbD9WRershSqjVQ8bI_cq3i6FDsIxE5WjE_PARZWS4kXXVD1yaJXZ9uicMwqZlQ7IBZLlY9miNuv2dDcXmrDRxC07j2eMmAlKCoI7E8Sqwd9MjYuWD9RkcWQCWRWHoaxXOQJya52HuENMWyJlSw3bzJqKGxHSth2enE8WcBZ5W_QXhw7NdCZXW5_xGyGeD8nrb6c9-JfVgBY9mZU42q2HZFA3y-KTz9S5-')"></div>
<div class="absolute inset-0 bg-gradient-to-b from-surface/80 via-surface/60 to-surface/90"></div>
</div>
<!-- Main Content Canvas (Transactional/Linear flow, no global nav) -->
<main class="flex-1 flex flex-col items-center justify-center relative z-10 px-margin-mobile">
<!-- Processing Container -->
<div class="flex flex-col items-center justify-center w-full max-w-sm">
<!-- Central Animated Element -->
<div class="relative w-32 h-32 mb-xl flex items-center justify-center">
<!-- Pulsing Background -->
<div class="absolute inset-0 rounded-full bg-secondary-container/20 pulse-ring"></div>
<!-- QR Frame -->
<div class="relative w-24 h-24 bg-surface-container-lowest rounded-xl shadow-lg border border-outline-variant flex items-center justify-center overflow-hidden">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">
                        qr_code
                    </span>
<!-- Scanning Line Overlay -->
<div class="absolute left-0 right-0 h-0.5 bg-secondary scanning-line shadow-[0_0_8px_rgba(0,88,190,0.8)]"></div>
</div>
</div>
<!-- Status Typography -->
<div class="text-center space-y-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">
                    QR Detected
                </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant animate-pulse">
                    Reading payment details...
                </p>
</div>
</div>
<!-- Optional: Bottom Safe Area Action (Cancel) -->
<div class="absolute bottom-lg w-full px-margin-mobile max-w-sm flex justify-center">
<button class="font-label-md text-label-md text-on-surface-variant bg-transparent border border-outline-variant rounded-full px-lg py-sm hover:bg-surface-container transition-colors duration-200">
                Cancel
            </button>
</div>
</main>
</body></html>
