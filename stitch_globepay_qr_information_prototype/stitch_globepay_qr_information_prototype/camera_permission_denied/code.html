</button>

<div class="absolute inset-4 bg-error-container rounded-full opacity-80"></div>

                    no_photography
                </span>
</div>

<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-4">

            </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[320px] mb-10">

            </p>
<!-- Action Button -->
<button class="w-full h-14 rounded-full bg-secondary-container text-on-secondary-container font-label-md text-label-md flex items-center justify-center hover:opacity-90 active:scale-[0.98] transition-all shadow-sm border border-outline-variant/20">
                Open Settings
            </button>

<button class="mt-6 font-disclaimer-sm text-disclaimer-sm text-on-surface-variant bg-transparent border-none outline-none hover:text-on-surface transition-colors">
