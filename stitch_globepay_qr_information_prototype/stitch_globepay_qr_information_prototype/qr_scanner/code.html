<!DOCTYPE html>

<html class="light" lang="en"><head>

                    "fontFamily": {

<style>
        .scanner-frame {
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
        }
        .corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #3B82F6;
            border-style: solid;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
        .corner-tl { top: 0; left: 0; border-width: 4px 0 0 4px; border-radius: 12px 0 0 0; }
        .corner-tr { top: 0; right: 0; border-width: 4px 4px 0 0; border-radius: 0 12px 0 0; }
        .corner-bl { bottom: 0; left: 0; border-width: 0 0 4px 4px; border-radius: 0 0 0 12px; }
        .corner-br { bottom: 0; right: 0; border-width: 0 4px 4px 0; border-radius: 0 0 12px 0; }
        
        .scan-line {
            width: 100%;
            height: 2px;
            background: #3B82F6;
            box-shadow: 0 0 10px #3B82F6, 0 0 20px #3B82F6;
            animation: scan 2s linear infinite;
            opacity: 0.8;
        }

        @keyframes scan {
            0% { transform: translateY(0); }
            50% { transform: translateY(280px); }
            100% { transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-black text-on-primary h-screen w-screen overflow-hidden flex flex-col font-body-md antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Top Navigation Placeholder (Hidden on this specific full-screen experience, but included for structure if needed, per JSON we keep structural integrity but it's full screen camera) -->
<!-- Main Camera View -->
<main class="relative flex-grow flex flex-col items-center justify-center w-full h-full">
<!-- Simulated Camera Feed Background -->
<div class="absolute inset-0 w-full h-full bg-cover bg-center" data-alt="A blurred, high-fidelity POV perspective of an upscale modern cafe counter. The scene is bright and airy with high-key lighting, capturing the premium, international travel aesthetic. Soft focus on a coffee cup and a payment terminal in the background, setting the scene for a mobile payment scan. Clean lines and a luxurious, minimalist atmosphere." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBLKq-DdRMtxte8WxKuA-R-9lvUQc7VLJc2dNAEKlLQyLQSh5eMlvlXTUmW4z5LWJItfjaIGaPKfPEyYjfOM2G86_VTVYJYL5GGsGtsW_l82G6tpPYiDgQRpLDm-7qMuDewy9OK7fif3JWlsQGhULvQW3q7ychwg7x9xtdmDeKr4kxE4MwJxOm-Xc-Vl0aDHs3WIDIIm3V2ftdEyVGx5kPc9SUeoUikbyjIeBu_XmgK4Z94V82YPHaR')"></div>
<!-- Dark Overlay outside the scanner frame -->
<div class="absolute inset-0 pointer-events-none scanner-frame z-10"></div>
<!-- Top Instruction -->
<div class="absolute top-24 z-20 w-full px-margin-mobile text-center">
<h1 class="font-headline-md text-headline-md text-white drop-shadow-md">Scan QR Code</h1>
<p class="font-body-md text-body-md text-white/90 drop-shadow mt-2">Position the QR code inside the frame</p>
</div>
<!-- Scanner Reticle -->
<div class="relative z-20 w-[280px] h-[280px] rounded-xl">
<!-- Animated Scan Line -->
<div class="absolute top-0 left-0 scan-line rounded-full z-30"></div>
<!-- Glowing Corners -->
<div class="corner corner-tl"></div>
<div class="corner corner-tr"></div>
<div class="corner corner-bl"></div>
<div class="corner corner-br"></div>
<!-- Inner transparent area (handled by box-shadow on overlay) -->
</div>
<!-- Secondary Actions (Flash / Upload) -->
<div class="absolute bottom-32 z-20 w-full flex justify-center gap-xl px-margin-mobile">
<button class="flex flex-col items-center gap-2 group focus:outline-none focus:ring-2 focus:ring-secondary-container rounded-lg p-2">
<div class="w-14 h-14 rounded-full bg-surface/20 backdrop-blur-md border border-white/30 flex items-center justify-center text-white group-hover:bg-surface/30 transition-colors">
<span class="material-symbols-outlined text-3xl" data-icon="flashlight_on">flashlight_on</span>
</div>
<span class="font-label-md text-label-md text-white drop-shadow">Flash</span>
</button>
<button class="flex flex-col items-center gap-2 group focus:outline-none focus:ring-2 focus:ring-secondary-container rounded-lg p-2">
<div class="w-14 h-14 rounded-full bg-surface/20 backdrop-blur-md border border-white/30 flex items-center justify-center text-white group-hover:bg-surface/30 transition-colors">
<span class="material-symbols-outlined text-3xl" data-icon="image">image</span>
</div>
<span class="font-label-md text-label-md text-white drop-shadow">Upload</span>
</button>
</div>
<!-- Disclaimer -->
<div class="absolute bottom-24 z-20 w-full px-margin-mobile text-center">
<p class="font-disclaimer-sm text-disclaimer-sm text-white/70 drop-shadow">GlobePay reads payment info only and does not process payments.</p>
</div>
</main>
<!-- Bottom Navigation from JSON -->
<nav aria-label="Bottom Navigation" class="fixed bottom-0 w-full z-50 rounded-t-xl shadow-[0px_-4px_20px_rgba(11,31,51,0.05)] bg-surface-container-lowest dark:bg-primary-container md:hidden shadow-lg hover:opacity-80 transition-opacity scale-110 duration-300 transition-transform fixed bottom-0 left-0 w-full flex justify-around items-center px-4 py-2 pb-safe">
<!-- Home (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-primary-container p-2 focus:outline-none focus:ring-2 focus:ring-secondary-container rounded-lg" href="#">
<span class="material-symbols-outlined text-2xl mb-1" data-icon="home">home</span>
<span class="font-label-md text-label-md">Home</span>
</a>
<!-- Scan (Active) -->
<a aria-current="page" class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary text-on-secondary-container dark:text-on-secondary rounded-full p-2 w-12 h-12 focus:outline-none focus:ring-2 focus:ring-secondary-container ring-offset-2 ring-offset-surface-container-lowest" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="qr_code_scanner" data-weight="fill" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<!-- Label hidden in active state circle as per common pattern, or displayed below if layout demands. Sticking to JSON classes which define w-12 h-12 rounded-full, suggesting icon only for active visual punch -->
</a>
<!-- Activity (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-primary-container p-2 focus:outline-none focus:ring-2 focus:ring-secondary-container rounded-lg" href="#">
<span class="material-symbols-outlined text-2xl mb-1" data-icon="receipt_long">receipt_long</span>
<span class="font-label-md text-label-md">Activity</span>
</a>
<!-- Profile (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-primary-container p-2 focus:outline-none focus:ring-2 focus:ring-secondary-container rounded-lg" href="#">
<span class="material-symbols-outlined text-2xl mb-1" data-icon="person">person</span>
<span class="font-label-md text-label-md">Profile</span>
</a>
</nav>
<!-- Script to ensure minimum layout stability for demo -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simple interaction demo for buttons
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.addEventListener('click', function() {
                    this.querySelector('div').style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        this.querySelector('div').style.transform = 'scale(1)';
                    }, 150);
                });
            });
        });
    </script>
</body></html>
