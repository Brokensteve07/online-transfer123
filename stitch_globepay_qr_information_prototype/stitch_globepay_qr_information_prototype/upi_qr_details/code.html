        .material-symbols-outlined {

<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline flat no shadows scale-95 duration-200 transition-transform flex justify-between items-center h-16 px-margin-mobile">
<div class="flex items-center">
<button aria-label="Go back" class="mr-4 text-on-surface hover:bg-surface-container dark:hover:bg-surface-container-high transition-colors rounded-full p-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-primary-fixed">GlobePay</h1>
</div>
<div class="flex items-center space-x-2">
<span class="font-label-md text-label-md text-on-surface-variant dark:text-on-surface-variant bg-surface-variant rounded-full px-3 py-1">V1 Prototype</span>
</div>
</header>
<!-- Main Canvas (Transactional/Task Screen - Navigation hidden) -->
<main class="flex-grow pt-24 pb-32 px-margin-mobile md:px-gutter max-w-container-max mx-auto w-full flex flex-col items-center">
<!-- Detected Status Area -->
<div class="w-full max-w-md flex flex-col items-center mb-8">
<div class="w-20 h-20 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center mb-4 shadow-lg">
<span class="material-symbols-outlined text-4xl" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
</div>
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-center mb-2">UPI QR Detected</h2>
<div class="inline-flex items-center px-3 py-1 rounded-full bg-surface-variant text-on-surface-variant font-label-md text-label-md">
<span class="material-symbols-outlined text-sm mr-1" data-icon="info">info</span>
                Read Only Mode
            </div>
</div>
<!-- Merchant Info Card -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl border border-outline-variant shadow-[0px_4px_20px_rgba(11,31,51,0.05)] p-6 mb-6">
<div class="flex items-center mb-6 pb-6 border-b border-surface-variant">
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mr-4">
<span class="material-symbols-outlined" data-icon="store">store</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md">The Chai Shop</h3>
<p class="font-body-md text-body-md text-on-surface-variant">chai@upi</p>
</div>
</div>
<!-- Financial Details -->
<div class="space-y-4 mb-6">
<div class="flex justify-between items-center">
<span class="font-body-lg text-body-lg text-on-surface-variant">Original Amount</span>
<span class="font-body-lg text-body-lg">₹100.00</span>
</div>
<div class="flex justify-between items-center">
<div class="flex items-center text-on-surface-variant">
<span class="font-body-md text-body-md mr-1">Est. Service Fee</span>
<span class="material-symbols-outlined text-sm cursor-help" data-icon="help">help</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant">₹2.00</span>
</div>
<div class="pt-4 border-t border-surface-variant flex justify-between items-center">
<span class="font-headline-md text-headline-md">Est. Total</span>
<span class="font-headline-md text-headline-md text-primary">₹102.00</span>
</div>
</div>
<!-- Prominent Disclaimer -->
<div class="bg-surface-variant rounded-lg p-4 flex items-start space-x-3">
<span class="material-symbols-outlined text-on-surface-variant mt-0.5" data-icon="warning">warning</span>
<div>
<p class="font-label-md text-label-md mb-1 text-on-surface">Payment execution is not supported.</p>
<p class="font-disclaimer-sm text-disclaimer-sm text-on-surface-variant">Use your banking app to complete the transaction to chai@upi.</p>
</div>
</div>
</div>
<!-- Action Button -->
<div class="w-full max-w-md mt-auto mb-8">
<button class="w-full h-14 bg-secondary text-on-secondary rounded-xl font-label-md text-label-md shadow-sm hover:opacity-90 transition-opacity flex items-center justify-center">
                Done
            </button>
</div>
</main>
<script>
        // Simple script to handle 'Done' button click to simulate going back
        document.querySelector('button.bg-secondary').addEventListener('click', () => {
            // In a real app, this would route back to the previous screen
            console.log('Done clicked - returning to previous state');
            // Adding a subtle click effect
            const btn = document.querySelector('button.bg-secondary');
            btn.style.transform = 'scale(0.98)';
            setTimeout(() => {
                btn.style.transform = 'scale(1)';
            }, 100);
        });
    </script>
